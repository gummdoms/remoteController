name: Build & Release

# Compila y publica los cuatro artefactos:
#   - Windows  (instalador NSIS .exe)
#   - Linux    (AppImage)
#   - Arch     (paquete pacman .pkg.tar.zst + repositorio bjrsoftware.db)
#   - Debian / Ubuntu (paquete .deb amd64)
# Y los publica en GitHub Releases y, si hay secretos configurados, en el
# data lake (https://datalake.dambra-os.com/public/remote-controller/releases/).

on:
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "distros/**/README.md"
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            publish_github_release:
                description: "Publicar release en GitHub"
                type: boolean
                default: true
            publish_datalake:
                description: "Subir artefactos al data lake"
                type: boolean
                default: true

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    NODE_VERSION: "20"

jobs:
    # ---------------------------------------------------------------- Windows
    build-windows:
        if: github.actor != 'github-actions[bot]'
        runs-on: windows-2022
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup MSVC toolchain
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Install dependencies
              shell: bash
              run: npm install --no-audit --no-fund

            - name: Build native modules
              shell: bash
              run: npm run build:native

            - name: Build styles
              shell: bash
              run: npm run build:sass

            - name: Build Windows installer
              shell: bash
              run: npm run dist:win -- --publish never

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  if-no-files-found: error
                  retention-days: 7
                  path: dist/*.exe

    # ------------------------------------------------------------- AppImage
    # Se compila en Ubuntu 22.04 para no exigir una glibc más nueva que la de
    # la mayoría de distribuciones (Ubuntu 24.04 usaría glibc 2.39).
    build-linux-appimage:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-22.04
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      build-essential python3 make g++ pkg-config \
                      libx11-dev libxtst-dev libxi-dev libxext-dev libxrandr-dev \
                      libpng-dev libxkbcommon-dev libudev-dev

            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Build native modules
              run: npm run build:native

            - name: Build styles
              run: npm run build:sass

            - name: Build Linux AppImage
              run: npm run dist:linux -- --publish never

            - name: Upload Linux artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux-appimage
                  if-no-files-found: error
                  retention-days: 7
                  path: dist/*.AppImage

    # ------------------------------------------------------- Arch / pacman
    # Reutiliza el AppImage ya compilado (evita recompilar Electron dentro del
    # contenedor) y genera el paquete pacman + el índice del repositorio.
    build-arch-package:
        if: github.actor != 'github-actions[bot]'
        needs: build-linux-appimage
        runs-on: ubuntu-latest
        timeout-minutes: 40
        container: archlinux:latest
        steps:
            - name: Install Arch dependencies
              run: |
                  pacman-key --init
                  pacman-key --populate archlinux
                  pacman -Syu --noconfirm --disable-download-timeout
                  pacman -S --noconfirm --needed base-devel git nodejs npm sudo imagemagick

            - name: Checkout
              uses: actions/checkout@v4

            - name: Download AppImage artifact
              uses: actions/download-artifact@v4
              with:
                  name: linux-appimage
                  path: dist

            - name: Build Arch package
              run: |
                  id -u builder >/dev/null 2>&1 || useradd -m builder
                  chown -R builder:builder "$GITHUB_WORKSPACE"
                  runuser -u builder -- env HOME=/home/builder \
                    bash -lc "cd '$GITHUB_WORKSPACE' && npm run dist:arch:pkg"

            - name: Generate pacman repository index
              run: |
                  runuser -u builder -- env HOME=/home/builder \
                    bash -lc "cd '$GITHUB_WORKSPACE' && npm run dist:arch:publish"

            - name: Upload Arch package
              uses: actions/upload-artifact@v4
              with:
                  name: archlinux-package
                  if-no-files-found: error
                  retention-days: 7
                  path: |
                      dist/*.pkg.tar.zst
                      dist/datalake-upload/**

    # ------------------------------------------------------- Debian / Ubuntu
    # Reutiliza el AppImage ya compilado: el .deb lleva la app desempaquetada en
    # /opt/remotecontrollers (sin FUSE) y declara las dependencias para que
    # `apt install ./remotecontrollers_x.deb` no pida nada más.
    build-debian-package:
        if: github.actor != 'github-actions[bot]'
        needs: build-linux-appimage
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download AppImage artifact
              uses: actions/download-artifact@v4
              with:
                  name: linux-appimage
                  path: dist

            - name: Install icon tooling
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends imagemagick

            - name: Build Debian package
              run: npm run dist:deb

            - name: Inspect Debian package
              run: |
                  set -euo pipefail
                  DEB=$(ls dist/*.deb | head -1)
                  dpkg-deb --info "$DEB"
                  dpkg-deb --contents "$DEB" | sed -n '1,30p'
                  {
                    echo "### Paquete .deb"
                    echo ""
                    echo "- \`$(basename "$DEB")\` ($(du -h "$DEB" | cut -f1))"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Debian package
              uses: actions/upload-artifact@v4
              with:
                  name: debian-package
                  if-no-files-found: error
                  retention-days: 7
                  path: dist/*.deb

    # ------------------------------------------------------------- Release
    publish:
        if: |
            always() &&
            needs.build-windows.result == 'success' &&
            needs.build-linux-appimage.result == 'success' &&
            (github.event_name != 'workflow_dispatch' || inputs.publish_github_release)
        needs: [build-windows, build-linux-appimage, build-arch-package, build-debian-package]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets

            - name: Download Arch artifact
              if: needs.build-arch-package.result == 'success'
              uses: actions/download-artifact@v4
              with:
                  name: archlinux-package
                  path: release-assets/archlinux-package

            - name: Download Debian artifact
              if: needs.build-debian-package.result == 'success'
              uses: actions/download-artifact@v4
              with:
                  name: debian-package
                  path: release-assets/debian

            - name: Prepare release assets
              run: |
                  set -euo pipefail
                  mkdir -p release-assets/arch/repo
                  shopt -s nullglob
                  for entry in release-assets/archlinux-package/*; do
                    if [[ -d "$entry" ]]; then
                      cp -a "$entry"/. release-assets/arch/repo/
                    else
                      cp -a "$entry" release-assets/arch/
                    fi
                  done
                  find release-assets -type f | sort

            - name: Compute release metadata
              id: meta
              run: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

                  if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
                    echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                    echo "name=${{ github.event.release.name }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
                    echo "name=Remote Controllers v${VERSION} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build release notes
              run: |
                  set -euo pipefail
                  PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
                  LOG_SOURCE="${PREV_TAG:+$PREV_TAG..HEAD}"
                  LOG_SOURCE="${LOG_SOURCE:-HEAD}"
                  CHANGES=$(git log $LOG_SOURCE --pretty=format:'- %s (%h)' -n 25 || true)
                  [[ -n "$CHANGES" ]] || CHANGES='- Sin cambios detectados.'

                  {
                    echo "## Remote Controllers v${{ steps.meta.outputs.version }}"
                    echo ""
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')"
                    echo ""
                    echo "### Cambios"
                    echo "$CHANGES"
                    echo ""
                    echo "### Artefactos"
                    echo "- Windows: \`Remote Controllers Setup ${{ steps.meta.outputs.version }}.exe\`"
                    echo "- Linux: \`Remote Controllers-${{ steps.meta.outputs.version }}.AppImage\`"
                    echo "- Arch Linux: \`remotecontrollers-bin-${{ steps.meta.outputs.version }}-x86_64.pkg.tar.zst\`"
                    echo "- Debian / Ubuntu: \`remotecontrollers_${{ steps.meta.outputs.version }}-1_amd64.deb\`"
                    echo ""
                    echo "### Instalación en Debian / Ubuntu"
                    echo '```bash'
                    echo "sudo apt install ./remotecontrollers_*_amd64.deb"
                    echo '```'
                    echo ""
                    echo "### Instalación en Arch"
                    echo '```bash'
                    echo "sudo pacman -Sy && sudo pacman -S remotecontrollers-bin"
                    echo '```'
                  } > release-body.md

            - name: Check data lake credentials
              id: lake
              env:
                  # Se aceptan tanto Repository secrets como Repository variables
                  # (Settings -> Secrets and variables -> Actions). `vars` gana.
                  DATA_LAKE_URL: ${{ vars.DATA_LAKE_URL || secrets.DATA_LAKE_URL }}
                  DATA_LAKE_UPLOAD_URL: ${{ vars.DATA_LAKE_UPLOAD_URL || secrets.DATA_LAKE_UPLOAD_URL }}
                  DATA_LAKE_USER: ${{ vars.DATA_LAKE_USER || secrets.DATA_LAKE_USER }}
                  DATA_LAKE_PASSWORD: ${{ vars.DATA_LAKE_PASSWORD || secrets.DATA_LAKE_PASSWORD }}
                  DATA_LAKE_STORAGE_PATH: ${{ vars.DATA_LAKE_STORAGE_PATH || secrets.DATA_LAKE_STORAGE_PATH }}
                  RELEASES_BASE: ${{ vars.RELEASES_BASE || secrets.RELEASES_BASE }}
                  TS_AUTHKEY: ${{ vars.TS_AUTHKEY || secrets.TS_AUTHKEY }}
                  DATA_LAKE_TAILSCALE_HOST: ${{ vars.DATA_LAKE_TAILSCALE_HOST || secrets.DATA_LAKE_TAILSCALE_HOST }}
              run: |
                  {
                    echo "### Data lake — diagnóstico"
                    echo ""
                    echo "| Variable | Definida |"
                    echo "|----------|----------|"
                  } >> "$GITHUB_STEP_SUMMARY"
                  for name in DATA_LAKE_URL DATA_LAKE_UPLOAD_URL DATA_LAKE_USER DATA_LAKE_PASSWORD DATA_LAKE_STORAGE_PATH RELEASES_BASE TS_AUTHKEY DATA_LAKE_TAILSCALE_HOST; do
                    if [[ -n "${!name:-}" ]]; then
                      echo "| \`$name\` | sí |" >> "$GITHUB_STEP_SUMMARY"
                    else
                      echo "| \`$name\` | **no** |" >> "$GITHUB_STEP_SUMMARY"
                    fi
                  done

                  if [[ -n "${DATA_LAKE_URL}" && -n "${DATA_LAKE_USER}" && -n "${DATA_LAKE_PASSWORD}" ]]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                    echo "::notice title=Data lake::Credenciales detectadas en variables o secrets."
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::warning title=Data lake::Faltan DATA_LAKE_URL / DATA_LAKE_USER / DATA_LAKE_PASSWORD (en Secrets *o* en Variables). El repositorio pacman NO se publicará (seguirá dando 404)."
                  fi

                  if [[ -n "${TS_AUTHKEY}" ]]; then
                    echo "tailscale=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::El runner se unirá a la tailnet para subir al data lake (sin Cloudflare)."
                  else
                    echo "tailscale=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Join Tailscale for data lake upload
              id: ts
              if: steps.lake.outputs.configured == 'true' && steps.lake.outputs.tailscale == 'true'
              continue-on-error: true
              uses: tailscale/github-action@v2
              with:
                  # El nodo es efímero si la auth key se creó con la casilla
                  # "Ephemeral" marcada (no existe la opción `--ephemeral`
                  # en `tailscale up`).
                  authkey: ${{ vars.TS_AUTHKEY || secrets.TS_AUTHKEY }}
                  args: --hostname=rc-ci-${{ github.run_id }}

            - name: Configure data lake upload host
              if: steps.lake.outputs.configured == 'true'
              env:
                  CONFIGURED_UPLOAD_URL: ${{ vars.DATA_LAKE_UPLOAD_URL || secrets.DATA_LAKE_UPLOAD_URL }}
                  FALLBACK_UPLOAD_URL: ${{ vars.DATA_LAKE_TAILSCALE_HOST || secrets.DATA_LAKE_TAILSCALE_HOST }}
                  TAILSCALE_STATUS: ${{ steps.ts.outcome }}
              run: |
                  # Prioridad:
                  #   1) DATA_LAKE_UPLOAD_URL (variable o secreto) -> se usa tal cual.
                  #   2) Si el runner se unió a la tailnet -> host de Tailscale.
                  #   3) Sin Tailscale -> se sube directo a DATA_LAKE_URL.
                  if [[ -n "${CONFIGURED_UPLOAD_URL}" ]]; then
                    echo "DATA_LAKE_UPLOAD_URL=${CONFIGURED_UPLOAD_URL}" >> "$GITHUB_ENV"
                    echo "::notice title=Data lake::Usando DATA_LAKE_UPLOAD_URL configurado (se ignora la IP por defecto)."
                  elif [[ "${TAILSCALE_STATUS}" == "success" ]]; then
                    TS_HOST="${FALLBACK_UPLOAD_URL:-http://100.105.212.100:30001}"
                    echo "DATA_LAKE_UPLOAD_URL=${TS_HOST}" >> "$GITHUB_ENV"
                    echo "::warning title=Data lake::DATA_LAKE_UPLOAD_URL no está definido; se usará Tailscale (${TS_HOST}). Defínelo como variable o secreto si el host es otro."
                    tailscale status || true
                  else
                    echo "::notice title=Data lake::Sin DATA_LAKE_UPLOAD_URL ni Tailscale; se subirá usando DATA_LAKE_URL."
                  fi

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.name }}
                  target_commitish: ${{ github.sha }}
                  body_path: release-body.md
                  prerelease: false
                  make_latest: true
                  generate_release_notes: true
                  fail_on_unmatched_files: false
                  files: |
                      release-assets/windows-installer/*.exe
                      release-assets/linux-appimage/*.AppImage
                      release-assets/arch/*.pkg.tar.zst
                      release-assets/debian/*.deb
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload assets to data lake
              if: steps.lake.outputs.configured == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_datalake)
              env:
                  DATA_LAKE_URL: ${{ vars.DATA_LAKE_URL || secrets.DATA_LAKE_URL }}
                  # DATA_LAKE_UPLOAD_URL se define en el paso anterior ($GITHUB_ENV):
                  # valor configurado, o la IP de Tailscale solo como último recurso.
                  DATA_LAKE_USER: ${{ vars.DATA_LAKE_USER || secrets.DATA_LAKE_USER }}
                  DATA_LAKE_PASSWORD: ${{ vars.DATA_LAKE_PASSWORD || secrets.DATA_LAKE_PASSWORD }}
                  DATA_LAKE_STORAGE_PATH: ${{ vars.DATA_LAKE_STORAGE_PATH || secrets.DATA_LAKE_STORAGE_PATH }}
                  RELEASES_BASE: ${{ vars.RELEASES_BASE || secrets.RELEASES_BASE }}
              run: node scripts/upload-ci-assets.js "$GITHUB_WORKSPACE/release-assets"

            - name: Verify data lake publication
              if: steps.lake.outputs.configured == 'true'
              env:
                  RELEASES_BASE: ${{ vars.RELEASES_BASE || secrets.RELEASES_BASE }}
              run: |
                  set -euo pipefail
                  BASE="${RELEASES_BASE:-https://datalake.dambra-os.com/public/remote-controller/releases}"
                  BASE="${BASE%/}"

                  PKG_FILE=$(ls release-assets/arch/*.pkg.tar.zst 2>/dev/null | head -1 | xargs -r basename)
                  {
                    echo "### Repositorio pacman"
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"

                  for url in "$BASE/arch/x86_64/bjrsoftware.db" "$BASE/arch/x86_64/bjrsoftware.files" "$BASE/arch/x86_64/$PKG_FILE"; do
                    CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
                    echo "- \`$CODE\` $url" | tee -a "$GITHUB_STEP_SUMMARY"
                    if [[ "$CODE" != "200" ]]; then
                      echo "::warning title=Data lake::$url respondió $CODE"
                    fi
                  done

                  {
                    echo ""
                    echo "### Paquete Debian / Ubuntu"
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"
                  DEB_FILE=$(ls release-assets/debian/*.deb 2>/dev/null | head -1 | xargs -r basename || true)
                  if [[ -n "${DEB_FILE:-}" ]]; then
                    CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/debian/$DEB_FILE" || echo "000")
                    echo "- \`$CODE\` $BASE/debian/$DEB_FILE" | tee -a "$GITHUB_STEP_SUMMARY"
                    if [[ "$CODE" != "200" ]]; then
                      echo "::warning title=Data lake::$BASE/debian/$DEB_FILE respondió $CODE"
                    fi
                  else
                    echo "- _Sin paquete .deb en esta ejecución_" | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Warn if Arch package is missing
              if: needs.build-arch-package.result != 'success'
              run: |
                  echo "::warning title=Repositorio pacman::No se generó el paquete Arch; el repositorio [bjrsoftware] no se actualizará en esta ejecución."
                  {
                    echo "### Repositorio pacman"
                    echo ""
                    echo "⚠️ El paquete Arch falló; los usuarios de Arch no recibirán actualización."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Warn if Debian package is missing
              if: needs.build-debian-package.result != 'success'
              run: |
                  echo "::warning title=Paquete .deb::No se generó el paquete Debian/Ubuntu en esta ejecución."
                  {
                    echo "### Paquete Debian / Ubuntu"
                    echo ""
                    echo "⚠️ El paquete .deb falló; los usuarios de Debian/Ubuntu no recibirán actualización."
                  } >> "$GITHUB_STEP_SUMMARY"

    # Aviso explícito si algún artefacto no se pudo construir.
    notify-failure:
        if: |
            always() &&
            contains(needs.*.result, 'failure')
        needs: [build-windows, build-linux-appimage, build-arch-package, build-debian-package]
        runs-on: ubuntu-latest
        steps:
            - name: Resumen del fallo
              run: |
                  echo "### Algún artefacto no se pudo construir" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Job | Resultado |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|-----|-----------|" >> "$GITHUB_STEP_SUMMARY"
                  echo "| windows | ${{ needs.build-windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| linux-appimage | ${{ needs.build-linux-appimage.result }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| arch-package | ${{ needs.build-arch-package.result }} |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| debian-package | ${{ needs.build-debian-package.result }} |" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
